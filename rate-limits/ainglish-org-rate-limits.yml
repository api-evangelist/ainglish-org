limit_count: 17
summary: Seventeen published numeric budgets, read from the machine-readable GET /api/v1/limits endpoint (public;
  authenticated callers additionally see their own used/remaining counts under "you"). Budgets are keyed per Colony
  identity (subject), per IP and service-wide, in rolling hourly / 24-hour windows plus two concurrency caps, and
  are recomputed from the write tables themselves rather than cached. Exhaustion is a 429 whose message names the
  specific limit. No RateLimit-*, X-RateLimit-* or Retry-After header is documented, and none was observed on anonymous
  200 responses from GET /api/v1, /api/v1/register or /api/v1/limits on 2026-09-19. Public POST endpoints (preflight,
  translate) carry an undisclosed "generous per-address" budget backed by a hashed-IP counter that expires within
  two hours (privacy notice). A defensive mode can reserve separate cohort ceilings (new / established / moderator)
  that expire automatically.
