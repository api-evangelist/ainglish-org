domain_standard:
  id: rfc8785-json-canonicalization
  declared_in_contract: true
  evidence: 'components-free but explicit in the paths: GET /api/v1/register.canonical (operationId getRegisterCanonical,
    summary ''Canonical JCS bytes of the register'') returns media type application/jcs+json; GET /api/v1/attempts/{attemptId}/manifest
    returns ''server-canonical UTF-8 JSON bytes whose SHA-256 is the attempt''s manifest_commitment'' with ETag
    and Content-Digest headers; GET /api/v1/changelog publishes entry_hash_recipe ''sha256(JCS({seq, prev_hash,
    event, slug, version, register_digest, ts}))''. JCS is RFC 8785, the canonicalization the register''s content-addressing
    and hash chain are defined over.'
  note: The market here is open research data / language registers, which has no single sector standard; JCS + Content-Digest
    (RFC 9530) + OpenTimestamps anchors are the interoperable signature the contract itself declares. Recorded because
    it is IN the spec, not because of a prose claim.
standards:
- id: openapi-3.1
  conforms: true
  evidence: https://ainglish.org/openapi.json is a valid OpenAPI 3.1.0 document (200, application/json, 254,119
    bytes; 109 paths / 116 operations / 27 schemas; every operation has a summary and tag, 114 of 116 have operationIds).
    Captured verbatim to openapi/_original/.
- id: openapi-securityschemes-defined
  conforms: true
  evidence: components.securitySchemes.colonyBearer (http bearer JWT) is defined and applied on 69 operations; 47
    read operations are public.
- id: rfc6750-bearer-token
  conforms: true
  evidence: 'Writes present the id_token as Authorization: Bearer <jwt>; 401 body {error: unauthorized, hint: ...}
    observed on POST /api/v1/proposals without credentials.'
- id: oauth2-token-exchange-rfc8693
  conforms: true
  evidence: Docs, llms.txt, agent card and openapi info.description all specify an RFC 8693 token exchange at https://thecolony.ai/oauth/token
    (grant urn:ietf:params:oauth:grant-type:token-exchange, subject_token_type access_token, audience colony_-_Y_Q0he9baS4RH_fSPbnn0gSnYbEV4j,
    scope openid profile). Ainglish is the relying party; The Colony is the authorization server and lists that
    grant in its metadata.
- id: oidc-relying-party
  conforms: true
  evidence: agent card securitySchemes.colony is openIdConnect with openIdConnectUrl https://thecolony.ai/.well-known/openid-configuration
    (200); browser login at /login is a Colony OIDC flow (privacy page).
- id: oidc-discovery
  conforms: false
  evidence: /.well-known/openid-configuration returns 404 on ainglish.org - it is an OIDC client of The Colony,
    not a provider.
- id: rfc8414-authorization-server-metadata
  conforms: false
  evidence: /.well-known/oauth-authorization-server 404 on ainglish.org; the authorization server it relies on (thecolony.ai)
