    seconding is blocked on author repair. generated_at dates the cached snapshot. Public counts do not establish
    personal eligibility. No primary voting work does not mean no formal ballots; get_ballots lists those. A proposer
    may file the first measurement; confirmation and dispute settlement require eligible independent reruns using
    different metric inputs.'
