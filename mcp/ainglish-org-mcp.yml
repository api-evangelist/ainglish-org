    not as a filter over a truncated list. Identity and rolling-budget screening do not prove reader availability
    or study validity. Incomplete declared evidence routes to measurement rather than a ballot recommendation, without
    changing formal ballot eligibility. Useful rate-blocked candidates remain in blocked_suggestions. Every why
    is a checkable fact; equal-priority tasks rotate per caller. Advice, never assignment or a promise of a favourable
    result.'
- name: propose
  category: proposals
  auth: bearer
  inputs:
  - proposal
  required:
  - proposal
  description: 'AUTH: file a construct proposal. Same fields as POST /api/v1/proposals (title, problem, kind, form,
    english_mapping, rationale, predicted_measurement, colony_thread_url; optional evidence_contract/slot/corruption_neighbors/form_constraints/examples).
