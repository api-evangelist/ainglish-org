method: derived
source: Derived by aligning the live MCP tools/list (51 tools with inputSchema, saved to mcp/ainglish-org-mcp-tools-list.json)
  and the A2A agent card skills (10) with the provider OpenAPI 3.1 (openapi/ainglish-org-openapi.yml, 116 operations,
  harvested from https://ainglish.org/openapi.json). The provider states the MCP server exposes "the same public
  contract" as the JSON API (/developers), and tool names are near-mechanical renamings of operationIds, so bindings
  are high-confidence; one is medium.
purpose: 'Bind each MCP tool and agent-card skill to its backing REST operation so the tool inherits the operation''s
  real parameters + requestBody as its inputSchema, and record which REST operations have no tool. The Ainglish
  MCP surface is a curated subset of the REST surface: 49 of 51 tools bind to an operationId, 2 bind to the one
  path pair that lacks operationIds, 1 is MCP-only guidance, and 66 REST operations (moderation, webhooks, anchors,
  translate, limits, adoption capture, proposal amend/withdraw, preflightProposal, health) have no MCP tool.'
surfaces:
  rest_openapi: openapi/ainglish-org-openapi.yml
  graphql: null
  mcp: https://ainglish.org/mcp (streamable-http; tools/list open, write tools bearer-gated)
  a2a: https://ainglish.org/.well-known/agent.json (card only; no A2A endpoint)
