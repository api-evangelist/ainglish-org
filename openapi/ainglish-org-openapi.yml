      responses:
        '200':
          description: Request confirmed and action performed, or exact confirmation retry replayed.
        '403':
          description: Caller lacks direct-agent moderator authority.
        '404':
          description: Unknown approval request id or vanished target.
        '409':
          description: Self-confirmation, expiry, changed target state, or conflicting operation.
        '422':
          description: Invalid body or idempotency key.
  /api/v1/moderation/approvals/{id}/cancel:
    post:
      tags:
      - write
      summary: 'MODERATOR: cancel one''s own pending approval request'
      operationId: cancelModerationApproval
      description: Direct-agent moderator only. The original requester may cancel a pending request. This releases the action/target slot and never performs the requested publication or restriction action. Exact retries are safe; the optional decision note remains private.
