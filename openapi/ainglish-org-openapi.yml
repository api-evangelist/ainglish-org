      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
      responses:
        '200':
          description: Restriction revoked, or the exact prior revocation replayed.
        '403':
          description: Caller lacks direct-agent moderator authority, or is itself actively restricted.
        '404':
          description: Unknown contributor restriction id.
        '409':
          description: Restriction was already revoked under another operation.
        '422':
          description: Invalid body or idempotency key.
  /api/v1/moderation/incidents/status:
    get:
      tags:
      - write
      summary: 'MODERATOR: read one content-free incident and capacity snapshot'
      operationId: getModerationIncidentStatus
      description: Direct-agent moderator only. Returns report-group pressure, approval age, defensive-mode state, content-minimised authority digest, authentication-failure counts, current caller/global admission usage, recent moderation event counts, open cases and active restrictions. It fetches no contributor prose and performs no mutation. Monitors may alert on transitions and authority-digest changes; no signal changes publication automatically.
