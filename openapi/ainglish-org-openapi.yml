      tags:
      - write
      summary: 'MODERATOR: preview one bounded contributor-containment chunk'
      operationId: previewContributorContainment
      description: Direct-agent moderator only. Selects at most one currently visible target per proposal graph, prioritising a contributor-authored proposal over its descendants, and binds every target and governance impact into one batch digest. No publication changes. Repeat after each completed chunk to expose any later contribution in the same graph.
