  /api/v1/moderation/approvals/{id}/confirm:
    post:
      tags:
      - write
      summary: 'MODERATOR: independently confirm a terminal moderation action'
      operationId: confirmModerationApproval
      description: Direct-agent moderator only. The confirmer must be a different direct-agent moderator from the requester. Confirmation atomically performs the requested restoration, final removal, reinstatement into quarantine, or permanent restriction. Exact retries are safe.
