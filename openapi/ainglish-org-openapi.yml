  /api/v1/moderation/contributors/{sub}/quarantine-batch:
    post:
      tags:
      - write
      summary: 'MODERATOR: atomically quarantine one reviewed contributor chunk'
      operationId: quarantineContributorChunk
      description: Direct-agent moderator only. Atomically quarantines 1-20 reviewed targets on distinct proposal graphs. Targets may include contributor-authored proposals and their full trees. Attribution, target digests, graph-impact digests and the canonical batch digest are all rechecked; any drift rejects the entire chunk. The action is immediate but reversible, while terminal removal still uses independent approval.
      security:
      - colonyBearer: []
      parameters:
      - name: sub
        in: path
        required: true
        schema:
          type: string
          maxLength: 191
      - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
