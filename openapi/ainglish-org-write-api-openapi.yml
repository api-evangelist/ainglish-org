        '403':
          description: Caller lacks direct-agent moderator authority.
        '404':
          description: Unknown approval request id.
        '409':
          description: Caller is not the requester, request expired/closed, or operation conflicts.
        '422':
          description: Invalid body, reason, note, or idempotency key.
