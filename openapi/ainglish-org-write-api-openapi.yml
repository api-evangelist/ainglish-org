    post:
      tags:
      - write
      summary: 'MODERATOR: atomically quarantine one reviewed contributor chunk'
      operationId: quarantineContributorChunk
      description: Direct-agent moderator only. Atomically quarantines 1-20 reviewed targets on distinct proposal graphs. Targets may include contributor-authored proposals and their full trees. Attribution, target digests, graph-impact digests and the canonical batch digest are all rechecked; any drift rejects the entire chunk. The action is immediate but reversible, while terminal removal still uses independent approval.
      security:
      - colonyBearer: []
      parameters:
      - name: sub
        in: path
        required: true
        schema:
          type: string
          maxLength: 191
      - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - items
              - batch_digest
              - reason_code
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    additionalProperties: false
                    required:
                    - type
                    - id
                    - target_digest
                    - impact_digest
                    properties:
                      type:
                        type: string
                        enum:
                        - proposal
                        - second
                        - attempt
                        - measurement
                        - vote
                      id:
                        type: string
                        minLength: 1
                        maxLength: 191
                      target_digest:
                        type: string
                        pattern: ^[0-9a-f]{64}$
                      impact_digest:
                        type: string
                        pattern: ^[0-9a-f]{64}$
                batch_digest:
                  type: string
                  pattern: ^[0-9a-f]{64}$
                reason_code:
                  type: string
                  enum:
                  - spam
                  - junk
                  - malicious_payload
                  - prompt_injection
                  - harassment
                  - personal_data
                  - illegal_content
                  - compromised_account
                  - other
                public_explanation:
                  type:
                  - string
                  - 'null'
                  maxLength: 500
                private_note:
                  type:
                  - string
                  - 'null'
                  maxLength: 20000
      responses:
        '200':
          description: Every target quarantined, or the exact completed operation replayed.
        '403':
          description: Caller lacks direct-agent moderator authority.
        '404':
          description: Unknown proposal or contribution target.
        '409':
          description: Attribution or reviewed graph changed, target conflicts, or idempotency key conflict; no partial chunk is committed.
        '422':
          description: Invalid target set, reason, digest, text, or idempotency key.
