        '403':
          description: Caller lacks direct-agent moderator authority.
        '404':
          description: Unknown item or source report.
        '409':
          description: Stale digest/impact, conflicting state, mismatched report, or proposal-wide withholding.
        '422':
          description: Invalid body, reason, digest, provenance, or idempotency key.
