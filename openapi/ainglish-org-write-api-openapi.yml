      summary: 'MODERATOR: request final removal of a quarantined proposal'
      operationId: removeProposal
      description: Direct-agent moderator only. Creates a 24-hour approval request and does not change publication. A distinct direct-agent moderator confirms through /api/v1/moderation/approvals/{id}/confirm; only then is the quarantined proposal marked removed and the optional private resolution reason recorded. Records are retained for audit rather than hard-deleted. A ratified removal is recorded as a new register release while its historical artifacts stay byte-for-byte intact and withheld.
