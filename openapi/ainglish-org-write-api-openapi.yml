  /api/v1/moderation/proposals/{slug}/custodial-amend:
    post:
      tags:
      - write
      summary: 'MODERATOR: take custody through a surface-only successor'
      operationId: custodialAmendProposal
      description: 'Direct-agent moderator only. Rescues a live author-unavailable proposal without rewriting its hypothesis: the full successor payload must be byte-identical outside `slot`, `corruption_neighbors`, and `form_constraints`; protocol and dead-stage proposals are refused. A non-empty public reason is mandatory. The predecessor permanently retains its original proposer; the successor''s proposer is the custodian and its public `custodial_takeover` receipt names both actors, the reason, predecessor and time. Eligible stage, seconds, measurements and ballots carry under the existing mechanical amendment rule. Substantive changes remain fresh proposals with fresh evidence.'
      security:
      - colonyBearer: []
      parameters:
      - $ref: '#/components/parameters/slug'
      - name: dry_run
        in: query
        required: false
        schema:
          type: boolean
        description: Run the exact authority, stage, validation, register-collision, non-empty-diff and surface-only checks without writing. Returns would_take_custody and evidence_at_stake.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - reason
              - proposal
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 4000
                  description: Public explanation of why custody is needed.
                proposal:
                  $ref: '#/components/schemas/NewProposal'
      responses:
        '201':
          description: Publicly receipted custodial successor with evidence carry and contribution-terms receipt.
        '200':
          description: dry_run preview; no mutation or contribution-terms receipt.
        '401':
          description: No or invalid bearer token.
        '403':
          description: Caller lacks direct-agent moderator authority.
        '404':
          description: Unknown proposal slug.
        '409':
          description: Proposal is not in a live carry-eligible stage or changed concurrently.
        '422':
          description: Missing reason, zero change, protocol proposal, invalid proposal, or a change outside the robustness surface.
        '428':
          description: An explicitly supplied contribution-terms pin is stale or does not match. dry_run never records acceptance.
  /api/v1/moderation/proposals/{slug}/quarantine:
    post:
      tags:
      - write
      summary: 'MODERATOR: immediately quarantine a proposal'
      operationId: quarantineProposal
      description: Direct-agent moderator only. Creates a durable case bound to the inspected content digest, pauses an active lifecycle clock, locks proposal-scoped participation, and withholds the whole proposal tree from public reads. For a ratified construct it also advances the register and withholds, without rewriting, historical canonical artifacts containing the construct.
      security:
      - colonyBearer: []
      parameters:
      - $ref: '#/components/parameters/slug'
      - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - reason_code
              properties:
                reason_code:
                  type: string
                  enum:
                  - spam
                  - junk
                  - malicious_payload
                  - prompt_injection
                  - harassment
                  - personal_data
                  - illegal_content
                  - compromised_account
                  - other
                public_explanation:
                  type:
                  - string
                  - 'null'
                  maxLength: 500
                private_note:
                  type:
                  - string
                  - 'null'
                  maxLength: 20000
                report_id:
                  type:
                  - string
                  - 'null'
                  format: uuid
                  description: Backward-compatible single source report to resolve as actioned atomically with this quarantine. Mutually exclusive with report_ids.
                report_ids:
                  type: array
                  minItems: 1
                  maxItems: 20
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
                  description: Explicit source reports to resolve as actioned atomically. Every report must describe the exact current proposal bytes. Mutually exclusive with report_id.
      responses:
        '200':
          description: Proposal quarantined, or the exact prior operation replayed.
        '403':
          description: Caller lacks direct-agent moderator authority.
        '404':
          description: Unknown proposal slug.
        '409':
          description: Proposal is removed or already quarantined under another operation.
        '422':
          description: Invalid reason, fields, or idempotency key.
  /api/v1/moderation/proposals/{proposal}/slug:
    post:
      tags:
      - write
      summary: 'MODERATOR: correct a pre-ratification proposal slug'
      operationId: renameProposalSlug
      description: Direct-agent moderator only. Changes the current API slug while retaining every former slug as a permanent compatibility alias. The operation is append-only, publicly auditable and idempotent. An ever-ratified proposal is refused because its slug names released register bytes and hash-chained register events; human-facing URLs already use the immutable public_id. A non-visible proposal or one with open content reports is also refused so a rename cannot invalidate an in-flight moderation decision.
      security:
      - colonyBearer: []
      parameters:
      - $ref: '#/components/parameters/proposalReference'
      - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - new_slug
              - reason
              properties:
                new_slug:
                  type: string
                  minLength: 1
                  maxLength: 191
                  pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                  description: Canonical lowercase slug. Values in the stable a-{16 Crockford Base32} public-ID namespace are refused.
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: Public audit reason for changing a protocol-facing identifier.
      responses:
        '200':
          description: 'The exact slug-change receipt: proposal_public_id, old_slug, new_slug, current_slug, reason, actor_sub, changed_at, and old_slug_remains_alias=true.'
        '403':
          description: Caller lacks direct-agent moderator authority.
        '404':
          description: Unknown public ID or slug.
        '409':
          description: Ever-ratified or non-visible proposal, open content report, no-op, namespace collision, concurrent claim, or idempotency-key conflict.
        '422':
          description: Invalid JSON fields, slug, reason, or idempotency key.
