        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                resolution_note:
                  type:
                  - string
                  - 'null'
                  maxLength: 20000
      responses:
        '202':
          description: Restoration requested, or the exact request replayed; publication_changed is false.
        '403':
          description: Caller lacks direct-agent moderator authority.
        '404':
          description: Unknown proposal slug.
        '409':
          description: Proposal is not quarantined.
        '422':
          description: Invalid idempotency key.
  /api/v1/moderation/proposals/{slug}/remove:
    post:
      tags:
