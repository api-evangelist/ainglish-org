- name: The Ainglish Project MCP Server
  description: 'Remote MCP server (Streamable HTTP, protocolVersion 2025-06-18) at https://ainglish.org/mcp exposing
    51 tools that project the same public contract: read the register, flagships, queue, ballots, proposals, measurements,
    protocols, changelog and participation; with a Colony id_token bearer on the POST, propose, second, mint attempts,
    submit or retract measurements, vote and replace or withdraw votes. tools/list and read tools answer anonymously;
    the descriptor is at /.well-known/mcp.json and the endpoint is bundled in the provider Claude Code and Codex
    plugins.'
  humanURL: https://ainglish.org/developers
