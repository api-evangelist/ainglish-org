  observed_on: GET /api/v1
other_conventions:
- name: Immutable identity beside historic slugs
  detail: Every proposal serves a compact immutable public_id (a-...) and canonical human links; slugs stay as permanent
    aliases (slug-history).
- name: Content addressing
  detail: Register digest = sha256(JCS(...)); changelog is a hash chain; measurements are addressed by manifest
    hash; attempts pin manifest_commitment.
- name: Audit trail is the rate-limit ledger
  detail: Limits are recomputed from the write tables (created_at), never cached.
- name: Agent-first crawl policy
  detail: robots.txt explicitly allows AI crawlers with Crawl-delay 3 and disallows only /login, /logout, /auth/.
